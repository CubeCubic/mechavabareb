<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>უნივერსიტეტის შერჩევის სისტემა</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;600;700&display=swap');
        
        * {
            font-family: 'Noto Sans Georgian', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #6c757d;
            margin: 0;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            border: none;
            margin-bottom: 20px;
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        
        .form-select, .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px;
        }
        
        .form-select:focus, .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .exam-score-input {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .exam-score-input label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .exam-checkbox {
            width: 20px;
            height: 20px;
        }
        
        .score-input {
            border: 2px solid #667eea !important;
            font-size: 1.1rem !important;
            font-weight: 600 !important;
            text-align: center !important;
            height: 50px !important;
        }
        
        .score-input:focus {
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25) !important;
            border-color: #764ba2 !important;
        }
        
        .recommendation-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .recommendation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .compatibility-badge {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .chance-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .chance-very-high {
            background: #d4edda;
            color: #155724;
        }
        
        .chance-high {
            background: #cfe2ff;
            color: #084298;
        }
        
        .chance-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .chance-low {
            background: #f8d7da;
            color: #721c24;
        }
        
        .spinner-container {
            text-align: center;
            padding: 40px;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
        }
        
        #examsSection, #resultsSection {
            display: none;
        }
        
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        
        .step {
            flex: 1;
            text-align: center;
            position: relative;
        }
        
        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e9ecef;
            color: #6c757d;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .step.active .step-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .step.completed .step-number {
            background: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-graduation-cap"></i> უნივერსიტეტის შერჩევის სისტემა</h1>
            <p>აირჩიეთ საუკეთესო პროგრამა თქვენი ქულების მიხედვით</p>
        </div>
        
        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step active" id="step1">
                <div class="step-number">1</div>
                <small>ფილტრები</small>
            </div>
            <div class="step" id="step2">
                <div class="step-number">2</div>
                <small>გამოცდები</small>
            </div>
            <div class="step" id="step3">
                <div class="step-number">3</div>
                <small>შედეგები</small>
            </div>
        </div>
        
        <!-- Filters Section -->
        <div class="card" id="filtersSection">
            <div class="card-header">
                <i class="fas fa-filter"></i> შერჩევის კრიტერიუმები
            </div>
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-city"></i> ქალაქი</label>
                        <select id="citySelect" class="form-select">
                            <option value="ყველა">ყველა ქალაქი</option>
                            <option value="თბილისი">თბილისი</option>
                            <option value="ბათუმი">ბათუმი</option>
                            <option value="ქუთაისი">ქუთაისი</option>
                            <option value="გორი">გორი</option>
                            <option value="ახალციხე">ახალციხე</option>
                            <option value="თელავი">თელავი</option>
                            <option value="ზუგდიდი">ზუგდიდი</option>
                            <option value="სოფ. ხიჭაური">სოფ. ხიჭაური</option>
                            <option value="სოფ. გრემი">სოფ. გრემი</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-university"></i> უნივერსიტეტის ტიპი</label>
                        <select id="uniTypeSelect" class="form-select">
                            <option value="ყველა">ყველა ტიპი</option>
                            <option value="სახელმწიფო">სახელმწიფო (უფასო)</option>
                            <option value="კერძო">კერძო (ფასიანი)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-book"></i> მიმართულება</label>
                        <select id="categorySelect" class="form-select">
                            <option value="ყველა">ყველა მიმართულება</option>
                            <option value="საღვთისმეტყველო">საღვთისმეტყველო</option>
                            <option value="მედიცინა და ფარმაცია">მედიცინა და ფარმაცია</option>
                            <option value="IT და კომპიუტერული მეცნიერებები">IT და კომპიუტერული მეცნიერებები</option>
                            <option value="ბიზნესი და ეკონომიკა">ბიზნესი და ეკონომიკა</option>
                            <option value="სამართალი">სამართალი</option>
                            <option value="ხელოვნება და დიზაინი">ხელოვნება და დიზაინი</option>
                            <option value="მუსიკა და თეატრი">მუსიკა და თეატრი</option>
                            <option value="ინჟინერია">ინჟინერია</option>
                            <option value="ენები და ფილოლოგია">ენები და ფილოლოგია</option>
                            <option value="საბუნებისმეტყველო მეცნიერებები">საბუნებისმეტყველო მეცნიერებები</option>
                            <option value="სოციალური მეცნიერებები">სოციალური მეცნიერებები</option>
                            <option value="სასოფლო-სამეურნეო">სასოფლო-სამეურნეო</option>
                            <option value="განათლება">განათლება</option>
                            <option value="სხვა">სხვა</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-language"></i> სწავლების ენა</label>
                        <select id="languageSelect" class="form-select">
                            <option value="ყველა">ყველა ენა</option>
                            <option value="ქართული">ქართული</option>
                            <option value="ინგლისური">ინგლისური</option>
                            <option value="რუსული">რუსული</option>
                        </select>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button onclick="loadExams()" class="btn btn-primary">
                        <i class="fas fa-arrow-right"></i> შემდეგი
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Exams Section -->
        <div class="card" id="examsSection" style="display: none;">
            <div class="card-header">
                <i class="fas fa-pencil-alt"></i> გამოცდების ქულები
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle"></i> შეიყვანეთ თქვენი სავარაუდო ქულები (0-100). მინიმუმ 3 საგანი: ქართული + უცხოური + 1 დამატებითი.
                </div>
                
                <label class="form-label"><i class="fas fa-globe"></i> უცხოური ენა (აირჩიეთ ერთი)</label>
                <select id="foreignLanguageSelect" class="form-select mb-3">
                    <option value="">აირჩიეთ ენა</option>
                    <option value="ინგლისური ენა">ინგლისური</option>
                    <option value="გერმანული ენა">გერმანული</option>
                    <option value="ფრანგული ენა">ფრანგული</option>
                    <option value="რუსული ენა">რუსული</option>
                </select>
                
                <div id="mandatoryExamsContainer"></div>
                <div id="electiveExamsContainer"></div>
                
                <div class="d-flex justify-content-between mt-4">
                    <button onclick="backToFilters()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> უკან
                    </button>
                    <button onclick="getRecommendations()" class="btn btn-primary">
                        <i class="fas fa-search"></i> ძებნა
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Results Section -->
        <div id="resultsSection" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-t
